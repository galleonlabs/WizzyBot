    <ellipse cx="99" cy="124" rx="22" ry="32" fill="#77e8c9" transform="rotate(-5 99 124)"/>
    <ellipse cx="158" cy="122" rx="22" ry="32" fill="#77e8c9" transform="rotate(-3 158 122)"/>
    <ellipse cx="105" cy="113" rx="7" ry="10" fill="#f7f3ed" transform="rotate(-5 105 113)"/>
