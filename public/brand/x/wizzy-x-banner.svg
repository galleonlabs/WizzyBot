      <ellipse cx="99" cy="124" rx="22" ry="32" fill="#292933" transform="rotate(-5 99 124)"/>
      <ellipse cx="158" cy="122" rx="22" ry="32" fill="#292933" transform="rotate(-3 158 122)"/>
    </g>
    <pattern id="wizzy-pattern" width="320" height="260" patternUnits="userSpaceOnUse" patternTransform="rotate(-7)">
      <use href="#pattern-wizzy" transform="translate(16 -8) scale(.58)"/>
      <use href="#pattern-wizzy" transform="translate(218 174) scale(.34)" opacity=".65"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="#09090d"/>
