<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title description">
  <title id="title">Wizzy X profile banner</title>
  <desc id="description">A full-colour Wizzy hood floats over a dark repeating pattern of abstract Wizzy faces, with restrained mint and coral accents.</desc>
  <defs>
    <g id="pattern-wizzy">
      <path fill="#17171e" d="M33 98C47 76 68 64 86 48C97 38 99 24 94 10C124 14 154 28 180 52C210 80 228 116 226 154C224 195 192 226 147 235C99 244 54 229 31 196C9 164 12 129 33 98Z"/>
