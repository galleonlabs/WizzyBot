name: Catalog freshness
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'catalog/**'
      - 'src/catalog-freshness.ts'
      - 'scripts/catalog-freshness.ts'
      - '.github/workflows/catalog-freshness.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun scripts/catalog-freshness.ts --verify
  report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun scripts/catalog-freshness.ts
