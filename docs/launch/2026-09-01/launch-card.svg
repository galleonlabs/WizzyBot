<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Make Meme Markets</title>
  <desc id="description">A bold Wizzy launch card with the Make Meme Markets tagline and the hooded Wizzy mascot.</desc>
  <defs>
    <g id="wizzy-shape">
      <path fill="#17171e" d="M33 98C47 76 68 64 86 48C97 38 99 24 94 10C124 14 154 28 180 52C210 80 228 116 226 154C224 195 192 226 147 235C99 244 54 229 31 196C9 164 12 129 33 98Z"/>
      <path fill="#0c0c11" d="M48 104C61 80 91 68 127 68C165 68 195 83 208 108C221 134 207 164 178 181C148 198 101 200 70 183C39 166 32 133 48 104Z"/>
      <ellipse cx="99" cy="124" rx="22" ry="32" fill="#292933" transform="rotate(-5 99 124)"/>
      <ellipse cx="158" cy="122" rx="22" ry="32" fill="#292933" transform="rotate(-3 158 122)"/>
    </g>
    <pattern id="wizzy-pattern" width="430" height="370" patternUnits="userSpaceOnUse" patternTransform="rotate(-7)">
      <use href="#wizzy-shape" transform="translate(10 28) scale(.62)" opacity=".72"/>
      <use href="#wizzy-shape" transform="translate(285 225) scale(.32)" opacity=".48"/>
    </pattern>
    <clipPath id="accent-clip">
      <circle cx="1290" cy="422" r="292"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#09090d"/>
  <rect width="1600" height="900" fill="url(#wizzy-pattern)" opacity=".55"/>
  <rect x="0" y="0" width="18" height="900" fill="#ff6f83"/>

  <text x="82" y="330" fill="#f7f3ed" font-family="Unbounded, Arial, sans-serif" font-size="158" font-weight="780" letter-spacing="-8">MAKE</text>
  <text x="82" y="520" fill="#f7f3ed" font-family="Unbounded, Arial, sans-serif" font-size="158" font-weight="780" letter-spacing="-8">MEME</text>
  <text x="82" y="710" fill="#f7f3ed" font-family="Unbounded, Arial, sans-serif" font-size="158" font-weight="780" letter-spacing="-8">MARKETS</text>

  <circle cx="1290" cy="422" r="292" fill="#ff6f83"/>
  <g clip-path="url(#accent-clip)" opacity=".26">
    <rect x="1000" y="112" width="620" height="120" fill="#f7f3ed" transform="rotate(-10 1290 422)"/>
    <rect x="990" y="620" width="640" height="70" fill="#77e8c9" transform="rotate(-10 1290 422)"/>
  </g>
  <circle cx="1060" cy="165" r="34" fill="#77e8c9"/>
  <circle cx="1518" cy="692" r="24" fill="#f7f3ed"/>

  <g transform="translate(1009 166) scale(2.2)">
    <path fill="#f7f3ed" d="M33 98C47 76 68 64 86 48C97 38 99 24 94 10C124 14 154 28 180 52C210 80 228 116 226 154C224 195 192 226 147 235C99 244 54 229 31 196C9 164 12 129 33 98Z"/>
    <path fill="#202029" d="M48 104C61 80 91 68 127 68C165 68 195 83 208 108C221 134 207 164 178 181C148 198 101 200 70 183C39 166 32 133 48 104Z"/>
    <ellipse cx="99" cy="124" rx="22" ry="32" fill="#77e8c9" transform="rotate(-5 99 124)"/>
    <ellipse cx="158" cy="122" rx="22" ry="32" fill="#77e8c9" transform="rotate(-3 158 122)"/>
    <ellipse cx="105" cy="113" rx="7" ry="10" fill="#f7f3ed" transform="rotate(-5 105 113)"/>
    <ellipse cx="164" cy="111" rx="7" ry="10" fill="#f7f3ed" transform="rotate(-3 164 111)"/>
  </g>

</svg>
